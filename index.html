function elbow(a,b){return (a.x===b.x||a.y===b.y)?[b]:[{x:b.x,y:a.y},b]}
function buildPath(ids){
  var seq=['BASE'].concat(ids,['BASE']),pts=[PTS[seq[0]]],stopIdx=[];
  for(var i=1;i<seq.length;i++){
    var prev=pts[pts.length-1],nx=PTS[seq[i]];
    elbow(prev,nx).forEach(function(p){pts.push(p)});
    if(i<seq.length-1)stopIdx.push(pts.length-1);
  }
  var cum=[0];for(var j=1;j<pts.length;j++)cum.push(cum[j-1]+Math.hypot(pts[j].x-pts[j-1].x,pts[j].y-pts[j-1].y));
  var total=cum[cum.length-1];
  return {pts:pts,cum:cum,total:total,stopFrac:stopIdx.map(function(k){return cum[k]/total})};
}
function posAt(path,t){
  var L=clamp(t,0,1)*path.total,i=1;
  while(i<path.cum.length-1&&path.cum[i]<L)i++;
  var a=path.pts[i-1],b=path.pts[i],seg=(path.cum[i]-path.cum[i-1])||1,k=(L-path.cum[i-1])/seg;
  return {x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k};
}
function trailPts(path,t){
  var L=clamp(t,0,1)*path.total,out=[path.pts[0]];
  for(var i=1;i<path.pts.length;i++){if(path.cum[i]<=L)out.push(path.pts[i]);else break}
  out.push(posAt(path,t));return out;
}

function routeStats(r,sc){
  var elapsed=sc*r.dur,limit=r.start+elapsed,stopped=0;
  r.stops.forEach(function(s){if(s.dep<=limit)stopped+=s.dw;else if(s.arr<limit)stopped+=limit-s.arr});
  return '<div class="kv"><span>Hora del recorrido</span><b class="num">'+fmt(r.start+elapsed)+'</b></div><div class="kv"><span>Km con GPS</span><span class="num">'+(r.path.total*PXKM*sc).toFixed(1)+' km</span></div><div class="kv"><span>Tiempo en ruta</span><span class="num">'+Math.floor(elapsed/60)+' h '+Math.round(elapsed%60)+' min</span></div><div class="kv"><span>Tiempo en puntos</span><span class="num">'+Math.round(stopped)+' min</span></div>';
}
function vRuta(id){
  var r=RT.filter(function(x){return String(x.id)===String(id)})[0];
  if(!r){return vRutas()}
  var t=tOf(r);
  if(S.scrubFor!==r.id){S.scrub=t;S.scrubFor=r.id}
  var sc=Math.min(S.scrub==null?t:S.scrub,t);
  var st=routeStatus(r),v=VEH[r.veh];
  var ra=ALERTS.filter(function(a){return a.rt===r.id&&a.st!=='resuelta'}).map(function(a){return '<div class="alert" style="padding:8px 0"><span class="sevbar sev-'+a.sev+'"></span><div class="t">'+esc(a.tt)+'</div><div class="d">'+esc(a.ty)+' · '+a.at+'</div></div>'}).join('');
  setHead('Ruta '+r.id,DN[r.drv]+' · '+v.plate+' '+v.model+' · inicio '+fmt(r.start));
  var late=0,rows=r.stops.map(function(s,k){
    var q=stSt(s),late_=s.arr-s.w1;
    var est=q==='pend'?'<span class="pill p-off">Pendiente</span>':(q==='punto'?'<span class="pill p-run">En el punto</span>':(late_>0?'<span class="pill p-warn">Tarde +'+Math.round(late_)+' min</span>':'<span class="pill p-ok">A tiempo</span>'));
    return '<tr><td class="num">'+(k+1)+'</td><td>'+esc(PTS[s.pid].n)+'</td><td class="num">'+fmt(s.w0)+'–'+fmt(s.w1)+'</td><td class="num">'+(q==='pend'?'—':fmt(s.arr))+'</td><td class="num">'+(q==='ok'?fmt(s.dep):'—')+'</td><td class="num">'+(q==='ok'?s.dw+' min':'—')+'</td><td>'+(q==='pend'?'<span class="muted">'+esc(s.val.replace(' (revisar)',''))+'</span>':(s.manual?'<span class="pill p-warn">'+esc(s.val)+'</span>':esc(s.val)))+'</td><td>'+est+'</td></tr>';
  }).join('');
  var scrub=r.fresh||S.now<r.start?'<p class="note" style="margin-top:10px">La ruta aún no inicia. Cuando el conductor comience su turno desde la app, aquí aparece el recorrido real.</p>'
   :'<div class="scrub"><label class="lbl" for="scr">Reconstrucción del recorrido: arrastra para ver dónde estaba el vehículo</label><input type="range" id="scr" min="0" max="1000" value="'+Math.round(sc/Math.max(t,0.0001)*1000)+'"><div class="tm"><span>'+fmt(r.start)+'</span><span>ahora '+fmt(Math.min(S.now,r.start+r.dur))+'</span></div></div>';
  return '<p style="margin-bottom:12px"><a class="lnk" href="#rutas">← Volver a rutas</a></p>'
   +'<div class="grid2"><div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px"><h2 style="margin:0">Recorrido real</h2><span class="pill '+st.c+'">'+st.l+'</span></div><div id="rmap">'+routeMap(r,sc)+'</div>'+scrub
   +'<div class="legend"><span><i style="background:var(--ok)"></i>Punto cumplido</span><span><i style="background:var(--accent)"></i>En el punto</span><span><i style="background:var(--m-off)"></i>Pendiente</span><span>Línea punteada: ruta planificada</span></div></div>'
   +'<div class="stack"><div class="card"><h2>Resumen</h2><div class="rows" id="rstats" style="gap:6px;font-size:.84rem">'+routeStats(r,sc)+'</div><div class="kv" style="margin-top:6px;font-size:.84rem"><span>Puntos cumplidos</span><span class="num">'+stopsDone(r)+' de '+r.stops.length+'</span></div>'+(ra?'<h3 style="margin-top:12px">Alertas abiertas de esta ruta</h3>'+ra:'')+'</div>'
   +'<div class="card"><h2>Cómo se valida cada punto</h2><p class="note">Nivel '+r.lv+' para esta ruta. La llegada y la salida se detectan solas cuando el teléfono entra y sale del radio del punto, con la hora del servidor. Los niveles 2 y 3 piden foto y código del receptor al cerrar el punto.</p></div></div></div>'
   +'<div class="card" style="margin-top:14px"><h2>Puntos de la ruta</h2><div class="scroll"><table><thead><tr><th>#</th><th>Punto</th><th>Ventana</th><th>Llegada</th><th>Salida</th><th>Permanencia</th><th>Validación</th><th>Estado</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';

function render(){
  var h=(location.hash||'#centro').slice(1),html;
  if(h.indexOf('ruta-')===0)html=vRuta(h.slice(5));
  else if(h==='rutas')html=vRutas();
  else if(h==='combustible')html=vCombustible();
  else if(h==='alertas')html=vAlertas();
  else if(h==='flota')html=vFlota();
  else if(LOCK[h])html=vLock(h);
  else{h='centro';html=vCentro()}
  $('#view').innerHTML=html;renderNav(h);tickClock();
}

/* ---------- modal y avisos ---------- */
var tt;
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},3600)}
function openDlg(h){$('#dlg').innerHTML=h;$('#ov').hidden=false;var f=$('#dlg button, #dlg select, #dlg input');if(f)f.focus()}
function closeDlg(){$('#ov').hidden=true}
function usedDrv(){return RT.map(function(r){return r.drv})}
function usedVeh(){return RT.map(function(r){return r.veh})}
function assignDlg(){
  var dr=VEH.filter(function(v){return usedDrv().indexOf(v.i)<0});
  var ve=VEH.filter(function(v){return usedVeh().indexOf(v.i)<0});
  var opt=function(list,kind){return list.map(function(v){
    var dis=(kind==='d'&&v.consent==='pend')||(kind==='v'&&v.i===17);
    var lbl=kind==='d'?DN[v.i]+(v.consent==='pend'?' (sin consentimiento)':''):v.plate+' · '+v.model+(v.i===17?' (en taller)':'');
    return '<option value="'+v.i+'"'+(dis?' disabled':'')+'>'+esc(lbl)+'</option>'}).join('')};
  var pts=PIDS.map(function(id){var k=S.assignPts.indexOf(id);return '<button class="pt" type="button" data-act="pt" data-id="'+id+'" aria-pressed="'+(k>=0)+'">'+(k>=0?(k+1)+'. ':'')+esc(PTS[id].s)+'</button>'}).join('');
  return '<h2 id="dlgT">Asignar ruta</h2>'
   +'<div class="row2"><div class="field"><label for="aD">Conductor</label><select id="aD">'+opt(dr,'d')+'</select></div><div class="field"><label for="aV">Vehículo</label><select id="aV">'+opt(ve,'v')+'</select></div></div>'
   +'<div class="field"><span class="lbl">Puntos, en el orden en que se tocan</span><div class="pts" id="aPts">'+pts+'</div></div>'
   +'<div class="row2"><div class="field"><label for="aT">Hora de inicio</label><input type="time" id="aT" value="13:00"></div><div class="field"><label for="aL">Validación de cada punto</label><select id="aL"><option value="1">Nivel 1 · automática por geocerca</option><option value="2">Nivel 2 · automática + foto</option><option value="3">Nivel 3 · + código del receptor</option></select></div></div>'
   +'<p class="note">El conductor recibe la ruta en su app al iniciar el turno. Solo aparecen conductores y vehículos libres hoy; quien no firmó el consentimiento no puede asignarse.</p>'
   +'<div class="foot"><button class="btn" type="button" data-act="close">Cancelar</button><button class="btn btn-p" type="button" data-act="doassign">Asignar ruta</button></div>';
}

/* ---------- eventos ---------- */
function act(a,d,el){
  switch(a){
   case 'filt':S.filter=d.k;render();break;
   case 'geo':S.geo=!S.geo;render();break;
   case 'trail':S.trail=!S.trail;render();break;
   case 'selv':S.selV=(S.selV===+d.v)?null:+d.v;render();break;
   case 'assign':S.assignPts=[];openDlg(assignDlg());break;
   case 'pt':var i=S.assignPts.indexOf(d.id);if(i>=0)S.assignPts.splice(i,1);else S.assignPts.push(d.id);var dv=$('#aD').value,vv=$('#aV').value,tv=$('#aT').value,lv=$('#aL').value;openDlg(assignDlg());$('#aD').value=dv;$('#aV').value=vv;$('#aT').value=tv;$('#aL').value=lv;break;
   case 'doassign':
     var dd=$('#aD').value,vv2=$('#aV').value,tm=$('#aT').value||'13:00';
     if(dd===''||vv2===''){toast('Elige un conductor y un vehículo disponibles.');break}
     if(S.assignPts.length<2){toast('Elige al menos dos puntos para la ruta.');break}
     var hh=tm.split(':'),start=(+hh[0])*60+(+hh[1]);
     var id=Math.max.apply(null,RT.map(function(r){return r.id}))+1;
     var nr=mkRoute(RT.length,start,60+S.assignPts.length*55,S.assignPts.slice(),+$('#aL').value,id,+dd,+vv2);
     nr.fresh=true;RT.push(nr);S.lastNew=id;closeDlg();location.hash='#rutas';render();
     toast('Ruta '+id+' asignada a '+DN[+dd]+'. Se envía a su app al iniciar el turno.');break;
   case 'close':closeDlg();break;
   case 'anom':S.onlyAnom=!S.onlyAnom;render();break;
   case 'load':openDlg(loadDlg(+d.id));break;
   case 'ask':closeDlg();toast('Solicitud enviada al conductor por WhatsApp.');break;
   case 'reviewed':var ld=LOADS.filter(function(l){return l.id===+d.id})[0];ld.fl=[];ld.df=0;if(ld.v===4){ALERTS.forEach(function(a2){if(a2.id===5)a2.st='resuelta'})}closeDlg();render();toast('Carga marcada como revisada.');break;
   case 'afilt':S.alertF=d.k;render();break;
   case 'ack':ALERTS.forEach(function(a2){if(a2.id===+d.id)a2.st='reconocida'});render();toast('Alerta reconocida.');break;
   case 'solve':ALERTS.forEach(function(a2){if(a2.id===+d.id)a2.st='resuelta'});render();toast('Alerta resuelta.');break;
   case 'rule':RULES[+d.k][2]=!RULES[+d.k][2];el.setAttribute('aria-checked',String(RULES[+d.k][2]));break;
   case 'ffilt':S.fleetF=d.k;render();break;
  }
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(t){act(t.dataset.act,t.dataset,t);return}
  var r=e.target.closest('tr[data-go]');
  if(r&&!e.target.closest('a')&&r.dataset.go.indexOf('ruta-')===0){location.hash='#'+r.dataset.go}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#ov').hidden){closeDlg();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('g.mk,tr[data-act]')){e.preventDefault();act(e.target.dataset.act,e.target.dataset,e.target)}
});
$('#ov').addEventListener('click',function(e){if(e.target===$('#ov'))closeDlg()});
document.addEventListener('input',function(e){
  if(e.target.id==='scr'){
    var h=(location.hash||'').slice(1);if(h.indexOf('ruta-')!==0)return;
    var r=RT.filter(function(x){return String(x.id)===h.slice(5)})[0];if(!r)return;
    var t=tOf(r);S.scrub=t*(+e.target.value/1000);
    $('#rmap').innerHTML=routeMap(r,S.scrub);$('#rstats').innerHTML=routeStats(r,S.scrub);
  }
});
window.addEventListener('hashchange',function(){closeDlg();render();window.scrollTo(0,0)});
$('#liveBtn').addEventListener('click',function(){
  S.live=!S.live;this.setAttribute('aria-pressed',String(S.live));this.textContent=S.live?'■ Detener simulación':'▶ Simular en vivo';
  clearInterval(S.timer);
  if(S.live)S.timer=setInterval(function(){S.now=Math.min(S.now+2,17*60);render()},1500);
});
render();
})();
</script>

</body></html>
